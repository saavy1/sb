apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
        spec:
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
          initContainers:
            - name: install-config
              image: ghcr.io/recyclarr/recyclarr:8.7.0
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - mkdir -p /config/configs && rm -f /config/configs/*.yml && cp /bootstrap/*.yml /config/configs/
              volumeMounts:
                - name: bootstrap
                  mountPath: /bootstrap
                  readOnly: true
                - name: config
                  mountPath: /config
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:8.7.0
              imagePullPolicy: IfNotPresent
              args:
                - sync
              env:
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: recyclarr-api-keys
                      key: sonarr-api-key
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: recyclarr-api-keys
                      key: radarr-api-key
              volumeMounts:
                - name: config
                  mountPath: /config
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  memory: 256Mi
          volumes:
            - name: bootstrap
              configMap:
                name: recyclarr-config
            - name: config
              persistentVolumeClaim:
                claimName: recyclarr-config
